# 第一个server块：仅监听80端口，负责HTTP强制重定向到HTTPS（无其他业务配置）
server {
    listen 80;
    server_name www.chyuxin.top chyuxin.top 123.56.29.233;

    # 保留宝塔所需标识（SSL配置识别用）
    #error_page 404/404.html;

    # 简单高效的HTTP转HTTPS重定向（无循环风险）
    # 排除SSL验证目录.well-known，避免宝塔一键续期证书失败
    location ~ ^/.well-known/ {
        allow all;
        root /www/HRP/font;  # 与后端业务根目录保持一致
        try_files $uri $uri/ =404;
    }

    # 所有非.well-known的请求，全部重定向到HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # 80端口日志（可选，方便排查重定向问题）
    access_log /www/wwwlogs/www.chyuxin.top_80.log;
    error_log /www/wwwlogs/www.chyuxin.top_80.error.log;
}

# 第二个server块：仅监听443 ssl端口，处理所有核心业务（SSL、代理、静态资源等）
server {
    listen 443 ssl;
    server_name www.chyuxin.top chyuxin.top 123.56.29.233;

    # SSL证书配置（宝塔证书路径，保持不变）
    ssl_certificate /www/server/panel/vhost/cert/www.chyuxin.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.chyuxin.top/privkey.pem;

    # SSL优化配置（提升安全性和兼容性）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 保留宝塔所需标识（后续面板操作兼容）
    #error_page 404/404.html;

    # 实际生效的404配置（适配Vue SPA路由）
    error_page 404 /index.html;

    # 站点根目录（与你的原有配置一致）
    root /www/HRP/font;
    index index.html index.htm;

    # 1. /api/uploads 接口代理（优先匹配，保持原有配置）
    location /api/uploads {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 100m;
        access_log /www/wwwlogs/api_uploads.log;
        error_log /www/wwwlogs/api_uploads.error.log warn;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # 2. /api 接口代理（其次匹配，保持原有配置）
    location /api {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 100m;
        proxy_request_buffering on;
        proxy_buffering off;
    }

    # 3. 禁止访问敏感文件/目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # 4. SSL证书验证目录（允许访问）
    location ~ \.well-known {
        allow all;
    }

    # 5. 禁止证书验证目录存放敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 6. 静态资源缓存配置（排除/api路径，提升访问速度）
    location ~ ^(?!/api/).*\.(gif|jpg|jpeg|png|bmp|swf|ico|svg)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 7. Vue SPA路由支持（最后匹配，最低优先级）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 443端口核心日志（改为域名命名，方便排查）
    access_log /www/wwwlogs/www.chyuxin.top.log;
    error_log /www/wwwlogs/www.chyuxin.top.error.log;
}